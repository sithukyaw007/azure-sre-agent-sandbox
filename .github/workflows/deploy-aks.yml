name: Deploy AKS manifests

# GitOps loop for the SRE Agent demo.
#
#   pull_request  -> validate only (server-side dry-run, no cluster changes)
#   push to main  -> apply to the cluster
#
# This is what makes an agent-authored pull request meaningful: the agent proposes
# a change, a human approves the PR, and only the merge mutates the cluster. No
# direct kubectl from the agent, and the repo stays the source of truth.
#
# Auth uses OIDC federated credentials - no secrets are stored in GitHub.

on:
  # No path filter on pull_request: 'Validate manifests' is a required status check,
  # so it must report on every PR. A path-filtered required check never runs for PRs
  # that touch other files, leaving them permanently blocked.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'k8s/base/**'
      - '.github/workflows/deploy-aks.yml'
  workflow_dispatch:

permissions:
  id-token: write      # required for OIDC
  contents: read
  pull-requests: write # to comment the validation result on the PR

env:
  AZURE_CLIENT_ID: a84a2fe7-6712-40b8-8725-9aa2b7a072a3
  AZURE_TENANT_ID: 19ffb373-4547-4ebd-b7a8-2b4c6da14132
  AZURE_SUBSCRIPTION_ID: e5b30712-e866-49c1-8ebe-95f569524df0
  RESOURCE_GROUP: rg-srelab2-swedencentral
  CLUSTER_NAME: aks-srelab2
  NAMESPACE: pets

jobs:
  validate:
    name: Validate manifests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the base branch

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing

      - name: Validate manifests (server-side, falling back to client-side)
        id: dryrun
        run: |
          # The lab is stopped between demos to save cost. A stopped cluster has no
          # reachable API server, so a server-side dry run cannot run. Because this
          # job is a required status check, failing here would deadlock branch
          # protection and block every PR while the lab is suspended. Fall back to
          # client-side validation so the check still reports a real result.
          if kubectl cluster-info --request-timeout=20s >/dev/null 2>&1; then
            echo "mode=server" >> "$GITHUB_OUTPUT"
            echo "Cluster reachable - validating against the live API server (no changes applied)."
            kubectl apply -f k8s/base/application.yaml --dry-run=server 2>&1 | tee /tmp/dryrun.txt
            exit "${PIPESTATUS[0]}"
          else
            echo "mode=client" >> "$GITHUB_OUTPUT"
            echo "Cluster unreachable (likely suspended) - falling back to client-side validation." \
              | tee /tmp/dryrun.txt
            # --validate=false is required: client-side validation still tries to
            # download the OpenAPI schema from the API server, which is unreachable.
            kubectl apply -f k8s/base/application.yaml --dry-run=client --validate=false 2>&1 \
              | tee -a /tmp/dryrun.txt
            exit "${PIPESTATUS[0]}"
          fi

      - name: Show resource limits being proposed
        run: |
          echo "### Proposed container resources" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          grep -E "name:|memory:|cpu:" k8s/base/application.yaml \
            | grep -B1 -A2 -E "memory|cpu" | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Detect manifest changes
        id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
             | grep -qE '^k8s/base/'; then
            echo "manifests=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifests=false" >> "$GITHUB_OUTPUT"
            echo "No manifest changes in this PR; validation is a no-op."
          fi

      - name: Comment validation result on PR
        if: steps.changed.outputs.manifests == 'true'
        uses: actions/github-script@v7
        env:
          DRYRUN_MODE: ${{ steps.dryrun.outputs.mode }}
        with:
          script: |
            const fs = require('fs');
            let out = '';
            try { out = fs.readFileSync('/tmp/dryrun.txt', 'utf8'); } catch (e) { out = '(no output)'; }
            const body = [
              '### Manifest validation passed',
              '',
              process.env.DRYRUN_MODE === 'server'
                ? 'Server-side dry run against the live cluster succeeded. **No cluster changes were made.**'
                : 'Cluster is unreachable (lab suspended), so manifests were validated **client-side**. Re-run this check once the lab is resumed for full server-side validation.',
              'Merging this PR will apply these manifests to the `pets` namespace.',
              '',
              '<details><summary>Dry-run output</summary>',
              '',
              '```',
              out.trim().slice(0, 60000),
              '```',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  deploy:
    name: Deploy to AKS
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/base/application.yaml

      - name: Wait for rollout
        run: |
          for d in $(kubectl get deployment -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $d"
            kubectl rollout status "deployment/$d" -n "$NAMESPACE" --timeout=300s
          done

      - name: Report cluster state
        run: |
          {
            echo "### Deployed to \`$CLUSTER_NAME\`"
            echo ''
            echo '```'
            kubectl get pods -n "$NAMESPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
